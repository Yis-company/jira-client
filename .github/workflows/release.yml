name: Desktop release

on:
  pull_request:
    types: [closed]
    branches: [main]

permissions: {}

concurrency:
  group: desktop-release-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare draft release
    if: >-
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.ref == 'changeset-release/main' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.prepare.outputs.tag }}
      sha: ${{ steps.prepare.outputs.sha }}
      release_id: ${{ steps.prepare.outputs.release_id }}
      build: ${{ steps.prepare.outputs.build }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Create or resume draft release for merged version
        id: prepare
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/desktop-release.mjs prepare

  build:
    name: Build ${{ matrix.name }}
    needs: prepare
    if: needs.prepare.outputs.build == 'true'
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: deb,appimage
            output: linux-x64
          - name: Linux ARM64
            os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            bundles: deb,appimage
            output: linux-arm64
          - name: macOS ARM64
            os: macos-15
            target: aarch64-apple-darwin
            bundles: dmg
            output: macos-arm64
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - name: Install Linux bundle dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            build-essential curl file libfuse2 libayatana-appindicator3-dev \
            libgtk-3-dev librsvg2-dev libssl-dev \
            libwebkit2gtk-4.1-dev patchelf pkg-config
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml --lib
      - name: Build Tauri bundles
        env:
          APPLE_SIGNING_IDENTITY: ${{ runner.os == 'macOS' && '-' || '' }}
          APPIMAGE_EXTRACT_AND_RUN: '1'
        run: pnpm tauri build --target ${{ matrix.target }} --bundles ${{ matrix.bundles }} -- --locked
      - name: Stage expected installers
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "dist-release/${{ matrix.output }}"
          case "${{ matrix.output }}" in
            linux-x64|linux-arm64)
              shopt -s nullglob
              debs=(src-tauri/target/${{ matrix.target }}/release/bundle/deb/*.deb)
              appimages=(src-tauri/target/${{ matrix.target }}/release/bundle/appimage/*.AppImage)
              [[ ${#debs[@]} -eq 1 && ${#appimages[@]} -eq 1 ]]
              files=("${debs[@]}" "${appimages[@]}")
              ;;
            macos-arm64)
              shopt -s nullglob
              files=(src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg)
              [[ ${#files[@]} -eq 1 ]]
              ;;
          esac
          cp "${files[@]}" "dist-release/${{ matrix.output }}/"
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.output }}
          path: dist-release/${{ matrix.output }}/*
          if-no-files-found: error
          retention-days: 14

  finalize:
    name: Attach installers and publish
    needs: [prepare, build]
    if: needs.prepare.outputs.build == 'true' && needs.build.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - uses: actions/download-artifact@v7
        with:
          path: installers
      - name: Verify installers and publish draft
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          RELEASE_SHA: ${{ needs.prepare.outputs.sha }}
          RELEASE_ID: ${{ needs.prepare.outputs.release_id }}
        run: node scripts/desktop-release.mjs finalize installers
