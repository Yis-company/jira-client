name: Desktop release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release tag
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - run: node scripts/validate-release-version.mjs "$GITHUB_REF_NAME"
      - name: Require tagged commit on main
        run: |
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main

  build:
    name: Build ${{ matrix.name }}
    needs: validate
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: deb,appimage
            output: linux-x64
          - name: Linux ARM64
            os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            bundles: deb,appimage
            output: linux-arm64
          - name: macOS ARM64
            os: macos-15
            target: aarch64-apple-darwin
            bundles: dmg
            output: macos-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            build-essential curl file libfuse2 libayatana-appindicator3-dev librsvg2-dev \
            libssl-dev libwebkit2gtk-4.1-dev patchelf pkg-config \
            libgtk-3-dev
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml --lib
      - name: Build Tauri bundles
        env:
          APPLE_SIGNING_IDENTITY: ${{ runner.os == 'macOS' && '-' || '' }}
          APPIMAGE_EXTRACT_AND_RUN: '1'
        run: pnpm tauri build --target ${{ matrix.target }} --bundles ${{ matrix.bundles }} -- --locked
      - name: Stage expected installers
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "dist-release/${{ matrix.output }}"
          case "${{ matrix.output }}" in
            linux-arm64|linux-x64)
              shopt -s nullglob
              debs=(src-tauri/target/${{ matrix.target }}/release/bundle/deb/*.deb)
              appimages=(src-tauri/target/${{ matrix.target }}/release/bundle/appimage/*.AppImage)
              [[ ${#debs[@]} -eq 1 && ${#appimages[@]} -eq 1 ]]
              files=("${debs[@]}" "${appimages[@]}")
              ;;
            macos-arm64)
              shopt -s nullglob
              files=(src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg)
              [[ ${#files[@]} -eq 1 ]]
              ;;
          esac
          cp "${files[@]}" "dist-release/${{ matrix.output }}/"
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.output }}
          path: dist-release/${{ matrix.output }}/*
          if-no-files-found: error
          retention-days: 14

  draft-release:
    name: Create or refresh draft release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: installers
      - name: Create draft or replace draft assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" --json isDraft > release.json 2>/dev/null; then
            if [[ "$(jq -r .isDraft release.json)" != true ]]; then
              echo "Refusing to overwrite published release $TAG" >&2
              exit 1
            fi
          else
            gh release create "$TAG" --draft --generate-notes --title "$TAG"
          fi
          mapfile -t files < <(find installers -type f \( -name '*.dmg' -o -name '*.deb' -o -name '*.AppImage' \) -print)
          [[ ${#files[@]} -eq 5 ]]
          gh release upload "$TAG" "${files[@]}" --clobber
