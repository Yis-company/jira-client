name: PR checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Validation
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - name: Install Linux native test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            build-essential curl libayatana-appindicator3-dev \
            libgtk-3-dev librsvg2-dev libssl-dev \
            libwebkit2gtk-4.1-dev pkg-config
      - run: pnpm install --frozen-lockfile
      - run: pnpm run --if-present lint
      - run: pnpm exec tsc -b
      - run: pnpm test
      - run: node --test scripts/*.test.mjs
      - name: Check PR changeset
        if: github.event_name == 'pull_request'
        run: node scripts/check-changeset.mjs
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml --lib
