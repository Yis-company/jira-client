name: PR checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: ${{ matrix.name }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - name: Linux ARM64
            os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
          - name: macOS ARM64
            os: macos-15
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - name: Install Linux native test dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            build-essential curl libayatana-appindicator3-dev \
            libgtk-3-dev librsvg2-dev libssl-dev \
            libwebkit2gtk-4.1-dev pkg-config
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsc -b
      - run: pnpm test
      - run: node --test scripts/*.test.mjs
      - run: node scripts/validate-release-version.mjs
      - name: Validate PR changeset or generated release PR
        if: github.event_name == 'pull_request'
        run: node scripts/check-changeset.mjs
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml --lib
